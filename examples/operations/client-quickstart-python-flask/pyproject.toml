[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "valkey-client-quickstart-flask"
version = "0.1.0"
description = "A minimal Flask demonstration using Valkey GLIDE"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "Flask==3.1.3",
  "python-dotenv==1.2.3",
  "valkey-glide-sync==2.5.1",
  "waitress==3.0.2",
]

[project.scripts]
valkey-quickstart = "valkey_quickstart.app:main"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
valkey_quickstart = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a real Valkey topology",
  "journey: exercises the running Flask application",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["valkey_quickstart"]

[tool.coverage.run]
branch = true
source = ["valkey_quickstart"]

[tool.coverage.report]
fail_under = 80
show_missing = true
