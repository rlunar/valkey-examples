name: valkey-example-topology-aware-python-flask

x-valkey: &valkey
  image: valkey/valkey:9.1.1-trixie@sha256:64e361b630ecf18dff7ca4df6a88e6eafc193687eb48cff2c7e0a293ab67d29a
  restart: "no"
  networks:
    - demo
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "valkey-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
    interval: 1s
    timeout: 1s
    retries: 30
    start_period: 2s

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: valkey-example-topology-aware-python-flask:local
  restart: "no"
  init: true
  networks:
    - demo
  security_opt:
    - no-new-privileges:true
  env_file:
    - path: .env
      required: false
  environment:
    FLASK_HOST: 0.0.0.0
    FLASK_PORT: ${FLASK_PORT:-8000}
    FLASK_THREADS: ${FLASK_THREADS:-4}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    OTEL_ENABLED: ${OTEL_ENABLED:-true}
    OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-valkey-flask-demo}
    VALKEY_CONNECTION_TIMEOUT_MS: ${VALKEY_CONNECTION_TIMEOUT_MS:-2000}
    VALKEY_DATABASE_ID: "0"
    VALKEY_KEY_PREFIX: ${VALKEY_KEY_PREFIX:-valkey-examples:flask-base:v1}
    VALKEY_REQUEST_TIMEOUT_MS: ${VALKEY_REQUEST_TIMEOUT_MS:-1000}
  ports:
    - 127.0.0.1:${FLASK_PORT:-8000}:${FLASK_PORT:-8000}
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >-
        import os, urllib.request;
        urllib.request.urlopen(
        f"http://127.0.0.1:{os.environ['FLASK_PORT']}/health/ready",
        timeout=2)
    interval: 1s
    timeout: 3s
    retries: 60
    start_period: 3s

services:
  standalone:
    <<: *valkey
    profiles: ["standalone"]
    command:
      - valkey-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --protected-mode
      - "no"
    tmpfs:
      - /data

  app-standalone:
    <<: *app
    profiles: ["standalone"]
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: ${FLASK_PORT:-8000}
      FLASK_THREADS: ${FLASK_THREADS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-valkey-flask-demo}
      VALKEY_ADDRESSES: standalone:6379
      VALKEY_CONNECTION_TIMEOUT_MS: ${VALKEY_CONNECTION_TIMEOUT_MS:-2000}
      VALKEY_DATABASE_ID: "0"
      VALKEY_KEY_PREFIX: ${VALKEY_KEY_PREFIX:-valkey-examples:flask-base:v1}
      VALKEY_REQUEST_TIMEOUT_MS: ${VALKEY_REQUEST_TIMEOUT_MS:-1000}
      VALKEY_TOPOLOGY: standalone
    depends_on:
      standalone:
        condition: service_healthy

  sentinel-primary:
    <<: *valkey
    profiles: ["sentinel"]
    command:
      - valkey-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --protected-mode
      - "no"
    tmpfs:
      - /data

  sentinel-replica:
    <<: *valkey
    profiles: ["sentinel"]
    command:
      - valkey-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --protected-mode
      - "no"
      - --replicaof
      - sentinel-primary
      - "6379"
    tmpfs:
      - /data
    depends_on:
      sentinel-primary:
        condition: service_healthy

  sentinel-1:
    image: valkey/valkey:9.1.1-trixie@sha256:64e361b630ecf18dff7ca4df6a88e6eafc193687eb48cff2c7e0a293ab67d29a
    profiles: ["sentinel"]
    restart: "no"
    command:
      - /bin/sh
      - -c
      - cp /etc/valkey/sentinel.conf /tmp/sentinel.conf && exec valkey-sentinel /tmp/sentinel.conf
    volumes:
      - ./infra/sentinel/sentinel.conf:/etc/valkey/sentinel.conf:ro
    tmpfs:
      - /tmp
    networks:
      - demo
    security_opt:
      - no-new-privileges:true
    healthcheck: &sentinel-healthcheck
      test: ["CMD", "valkey-cli", "-h", "127.0.0.1", "-p", "26379", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 2s
    depends_on: &sentinel-dependencies
      sentinel-primary:
        condition: service_healthy
      sentinel-replica:
        condition: service_healthy

  sentinel-2:
    image: valkey/valkey:9.1.1-trixie@sha256:64e361b630ecf18dff7ca4df6a88e6eafc193687eb48cff2c7e0a293ab67d29a
    profiles: ["sentinel"]
    restart: "no"
    command:
      - /bin/sh
      - -c
      - cp /etc/valkey/sentinel.conf /tmp/sentinel.conf && exec valkey-sentinel /tmp/sentinel.conf
    volumes:
      - ./infra/sentinel/sentinel.conf:/etc/valkey/sentinel.conf:ro
    tmpfs:
      - /tmp
    networks:
      - demo
    security_opt:
      - no-new-privileges:true
    healthcheck: *sentinel-healthcheck
    depends_on: *sentinel-dependencies

  sentinel-3:
    image: valkey/valkey:9.1.1-trixie@sha256:64e361b630ecf18dff7ca4df6a88e6eafc193687eb48cff2c7e0a293ab67d29a
    profiles: ["sentinel"]
    restart: "no"
    command:
      - /bin/sh
      - -c
      - cp /etc/valkey/sentinel.conf /tmp/sentinel.conf && exec valkey-sentinel /tmp/sentinel.conf
    volumes:
      - ./infra/sentinel/sentinel.conf:/etc/valkey/sentinel.conf:ro
    tmpfs:
      - /tmp
    networks:
      - demo
    security_opt:
      - no-new-privileges:true
    healthcheck: *sentinel-healthcheck
    depends_on: *sentinel-dependencies

  app-sentinel:
    <<: *app
    profiles: ["sentinel"]
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: ${FLASK_PORT:-8000}
      FLASK_THREADS: ${FLASK_THREADS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-valkey-flask-demo}
      VALKEY_ADDRESSES: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      VALKEY_CONNECTION_TIMEOUT_MS: ${VALKEY_CONNECTION_TIMEOUT_MS:-2000}
      VALKEY_DATABASE_ID: "0"
      VALKEY_KEY_PREFIX: ${VALKEY_KEY_PREFIX:-valkey-examples:flask-base:v1}
      VALKEY_REQUEST_TIMEOUT_MS: ${VALKEY_REQUEST_TIMEOUT_MS:-1000}
      VALKEY_SENTINEL_MASTER: demo-primary
      VALKEY_TOPOLOGY: sentinel
    depends_on:
      sentinel-1:
        condition: service_healthy
      sentinel-2:
        condition: service_healthy
      sentinel-3:
        condition: service_healthy

  cluster-node-1:
    <<: *valkey
    profiles: ["cluster"]
    command:
      - valkey-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --protected-mode
      - "no"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /data/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-hostname
      - cluster-node-1
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
      - --cluster-preferred-endpoint-type
      - hostname
    tmpfs:
      - /data

  cluster-node-2:
    <<: *valkey
    profiles: ["cluster"]
    command:
      - valkey-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --protected-mode
      - "no"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /data/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-hostname
      - cluster-node-2
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
      - --cluster-preferred-endpoint-type
      - hostname
    tmpfs:
      - /data

  cluster-node-3:
    <<: *valkey
    profiles: ["cluster"]
    command:
      - valkey-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --protected-mode
      - "no"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /data/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-hostname
      - cluster-node-3
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
      - --cluster-preferred-endpoint-type
      - hostname
    tmpfs:
      - /data

  cluster-init:
    image: valkey/valkey:9.1.1-trixie@sha256:64e361b630ecf18dff7ca4df6a88e6eafc193687eb48cff2c7e0a293ab67d29a
    profiles: ["cluster"]
    restart: "no"
    command:
      - valkey-cli
      - --cluster
      - create
      - cluster-node-1:6379
      - cluster-node-2:6379
      - cluster-node-3:6379
      - --cluster-yes
    networks:
      - demo
    security_opt:
      - no-new-privileges:true
    depends_on:
      cluster-node-1:
        condition: service_healthy
      cluster-node-2:
        condition: service_healthy
      cluster-node-3:
        condition: service_healthy

  app-cluster:
    <<: *app
    profiles: ["cluster"]
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: ${FLASK_PORT:-8000}
      FLASK_THREADS: ${FLASK_THREADS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-valkey-flask-demo}
      VALKEY_ADDRESSES: cluster-node-1:6379,cluster-node-2:6379,cluster-node-3:6379
      VALKEY_CONNECTION_TIMEOUT_MS: ${VALKEY_CONNECTION_TIMEOUT_MS:-2000}
      VALKEY_DATABASE_ID: "0"
      VALKEY_KEY_PREFIX: ${VALKEY_KEY_PREFIX:-valkey-examples:flask-base:v1}
      VALKEY_REQUEST_TIMEOUT_MS: ${VALKEY_REQUEST_TIMEOUT_MS:-1000}
      VALKEY_TOPOLOGY: cluster
    depends_on:
      cluster-init:
        condition: service_completed_successfully

networks:
  demo:
    driver: bridge
